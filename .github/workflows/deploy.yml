# Builds the static site and publishes it to GitHub Pages.
#
# The site is a project site, so it is served from https://<owner>.github.io/<repo>/
# rather than a domain root. Astro needs both halves of that URL at build time:
# SITE_URL for absolute canonical/OG tags, BASE_PATH for asset prefixes. Both
# are derived from the GitHub context, so nothing is hard-coded.
#
# PUBLIC_SITE_PREVIEW=1 makes every page emit `noindex`, so this public mirror
# never competes with the production domain in search results.
#
# ONE-TIME SETUP: Pages must be enabled by a human before the first deploy --
# Settings > Pages > Source: "GitHub Actions". GITHUB_TOKEN is not permitted to
# create the Pages site itself ("Resource not accessible by integration"), so
# actions/configure-pages is deliberately not used here. The build and its
# checks run regardless; only the deploy job needs Pages to exist.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/atlas-fitness-setup-q5pb7a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose: package.json's `packageManager` field is
      # the single source of truth, and specifying both makes this action fail
      # with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Derived from the GitHub context rather than actions/configure-pages, so
      # the build does not depend on Pages already being enabled. github.io
      # hostnames are lowercase; repository paths keep their original case.
      - name: Resolve Pages URL
        id: url
        run: |
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          echo "origin=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
          echo "base=/${repo}" >> "$GITHUB_OUTPUT"
          echo "Building for https://${owner}.github.io/${repo}/"

      - name: Typecheck
        run: pnpm check

      - name: Build
        env:
          SITE_URL: ${{ steps.url.outputs.origin }}
          BASE_PATH: ${{ steps.url.outputs.base }}
          PUBLIC_SITE_PREVIEW: '1'
        run: pnpm build

      # Fail loudly here rather than shipping an empty shell to Pages.
      - name: Verify output
        env:
          BASE_PATH: ${{ steps.url.outputs.base }}
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          grep -q 'Atlas Fitness Elite' dist/index.html \
            || { echo "::error::rendered text missing from build output"; exit 1; }
          grep -q 'application/ld+json' dist/index.html \
            || { echo "::error::JSON-LD missing from build output"; exit 1; }
          grep -q 'noindex' dist/index.html \
            || { echo "::error::preview build is not marked noindex"; exit 1; }
          grep -q "href=\"${BASE_PATH}/_astro/" dist/index.html \
            || { echo "::error::assets are not prefixed with ${BASE_PATH}"; exit 1; }
          if grep -q 'eruda' dist/index.html; then
            echo "::error::eruda leaked into the production build"; exit 1
          fi
          echo "Output verified."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
